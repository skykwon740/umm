<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Globe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/world.css">
<link rel="stylesheet" href="styles/panel.css">
<link rel="stylesheet" href="styles/results.css">
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="labels"></div>
<div id="resultActions" role="group" aria-label="도착한 단어의 결과 선택" hidden>
  <strong id="resultTitle"></strong>
  <div class="result-links">
    <a id="openWiki" class="btn go" target="_blank" rel="noopener noreferrer">위키백과</a>
    <a id="openImages" class="btn" target="_blank" rel="noopener noreferrer">구글 이미지</a>
  </div>
</div>
<div id="top">
  <div id="found"><span>발견</span><div id="meter"><i></i></div><span id="pct"></span></div>
</div>
<aside id="side">
  <div id="controls">
    <form id="bar">
      <input id="q" aria-label="탐험을 시작할 관심사" placeholder="관심사" autocomplete="off">
      <button id="goBtn">출발</button>
    </form>
    <div id="actions">
      <button id="again" type="button" hidden>이 주소에서 다시 출발</button>
    </div>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="routeBox"><h2>루트</h2><div id="chain"></div></div>
  <div id="hint"></div>
</aside>

<script type="module" src="src/app.js"></script>
</body>
</html>
